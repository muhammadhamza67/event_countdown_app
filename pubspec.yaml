name: event_countdown_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ✅ Core dependencies
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.2.0

  # 🎙️ Voice recording (full package)
  flutter_sound: ^9.2.13

  # 🗣️ Voice to text
  speech_to_text: ^7.3.0

  # 🧭 State management (optional)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/events.json
